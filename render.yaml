services:
  - type: web
    name: deen-guide-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "cd backend && gunicorn deen_guide.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        value: "replace-me-with-a-secure-key"

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_COOKIE_SECURE
        value: "True"

      - key: OPENAI_API_KEY
        value: ""

    autoDeploy: true

  - type: static
    name: deen-guide-frontend
    buildCommand: "cd frontend-vite && npm install && npm run build"
    staticPublishPath: "frontend-vite/dist"
    envVars:
      - key: VITE_API_BASE
        value: "https://deen-guide-backend.onrender.com/api"

    autoDeploy: true