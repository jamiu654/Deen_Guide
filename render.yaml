services:
  - type: web
    name: deen-guide-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn deen_guide.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: OPENAI_API_KEY
        fromDatabase: false
        value: "" # Set this in Render dashboard after connecting the repo
      - key: DJANGO_SECRET_KEY
        fromDatabase: false
        value: "replace-me-with-a-secure-key"
      - key: DJANGO_DEBUG
        fromDatabase: false
        value: "False"
      - key: DJANGO_COOKIE_SECURE
        fromDatabase: false
        value: "True"
    autoDeploy: true

  - type: web
    name: deen-guide-frontend
    env: static
    plan: free
    buildCommand: "cd frontend-vite && npm install && npm run build"
    staticPublishPath: "./frontend-vite/dist"
    envVars:
      - key: VITE_API_BASE
        value: "https://deen-guide-backend.onrender.com/api"
      - key: NODE_ENV
        value: "production"
    autoDeploy: true
